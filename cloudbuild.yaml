substitutions:
  _REGION: us-central1
  _SERVICE_NAME: rejectme
  _REPOSITORY: cloud-run
  _IMAGE_NAME: rejectme
  _SERVICE_ACCOUNT: rejectme-cloud-run@your-google-cloud-project-id.iam.gserviceaccount.com
  _FIREBASE_PROJECT_ID: your-firebase-project-id
  _FIREBASE_AUTH_DOMAIN: your-firebase-project-id.firebaseapp.com
  _FIREBASE_STORAGE_BUCKET: your-firebase-project-id.firebasestorage.app
  _FIREBASE_MESSAGING_SENDER_ID: "000000000000"
  _FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
  _GOOGLE_CLOUD_LOCATION: us-central1
  _GEMINI_MODEL: gemini-2.5-flash

steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv:
      - NEXT_PUBLIC_FIREBASE_API_KEY
    args:
      - -c
      - |
        docker build \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$$NEXT_PUBLIC_FIREBASE_API_KEY" \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${_FIREBASE_AUTH_DOMAIN}" \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${_FIREBASE_PROJECT_ID}" \
          --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${_FIREBASE_STORAGE_BUCKET}" \
          --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${_FIREBASE_MESSAGING_SENDER_ID}" \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${_FIREBASE_APP_ID}" \
          --build-arg GOOGLE_CLOUD_PROJECT="${PROJECT_ID}" \
          --build-arg GOOGLE_CLOUD_LOCATION="${_GOOGLE_CLOUD_LOCATION}" \
          --build-arg GEMINI_MODEL="${_GEMINI_MODEL}" \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${BUILD_ID}" \
          .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${BUILD_ID}

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_SERVICE_ACCOUNT}
      - --allow-unauthenticated
      - --timeout=300
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_GOOGLE_CLOUD_LOCATION},GEMINI_MODEL=${_GEMINI_MODEL},FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN},NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET},NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID},NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - --update-secrets=NEXT_PUBLIC_FIREBASE_API_KEY=firebase-web-api-key:latest

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${BUILD_ID}

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/firebase-web-api-key/versions/latest
      env: NEXT_PUBLIC_FIREBASE_API_KEY
